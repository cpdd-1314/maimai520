name: 部署到自有服务器

# 备选方案：把代码部署到你自己的 VPS（阿里云/腾讯云轻量等）。
# 需要在仓库 Settings -> Secrets 里配置：HOST、USERNAME、SSH_KEY、APP_DIR
# 国内服务器访问更快，且磁盘天然持久，不会像 Render 免费版那样丢数据。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: 同步代码并安装依赖、重启服务
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USERNAME@$HOST" "
            set -e
            mkdir -p $APP_DIR
          "
          rsync -az --delete \
            --exclude 'node_modules' --exclude 'data' --exclude '.git' --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" ./ "$USERNAME@$HOST:$APP_DIR/"
          ssh -i ~/.ssh/deploy_key "$USERNAME@$HOST" "
            set -e
            cd $APP_DIR
            npm install --omit=dev
            # 用 pm2 守护进程；未安装则先安装
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2
            pm2 restart wxshop --update-env || pm2 start server.js --name wxshop
            pm2 save
          "
